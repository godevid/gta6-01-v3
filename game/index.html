<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON TIDE — Costa Verde</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hint { position: fixed; left: 10px; bottom: 8px; color: rgba(255,255,255,.55); font: 12px/1.4 system-ui, sans-serif; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="game" aria-label="NEON TIDE: an open-world crime game. Drive, steal cars, outrun the police and finish missions in Costa Verde."></canvas>
<p id="status" role="status" aria-live="polite">NEON TIDE loaded.</p>
<div id="hint">WASD drive / walk &nbsp;·&nbsp; E enter or steal car &nbsp;·&nbsp; Mouse aim, click shoot &nbsp;·&nbsp; F punch &nbsp;·&nbsp; Space handbrake &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
